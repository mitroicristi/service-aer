    <div class="container mt-5">
        <h1>Test Meniu Dropdown</h1>
        <p>Încearcă să dai click pe butoanele de meniu pentru a vedea dacă dropdown-urile funcționează.</p>
    </div>

    <!-- Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="assets/bootstrap/js/bootstrap.js"></script>
    
    <script>
        // Test pentru a verifica dacă Bootstrap este încărcat
        console.log('Bootstrap version:', typeof bootstrap !== 'undefined' ? 'Loaded' : 'Not loaded');
        
        // Test pentru dropdown-uri
        document.addEventListener('DOMContentLoaded', function() {
            const dropdowns = document.querySelectorAll('.dropdown-toggle');
            dropdowns.forEach(dropdown => {
                dropdown.addEventListener('click', function(e) {
                    console.log('Dropdown clicked:', this.textContent);
                });
            });
        });
    </script>
